<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Abrir Toki OS</title>
  <script>
    const params = new URLSearchParams(location.search);
    // Los enlaces guardados de la tablet conservan sus modos de inicio.
    const tablet = ['games', 'apps', 'spotify'].includes(params.get('start')) ||
      params.get('acceso') === 'iman' || params.get('entrada') === 'teclado';
    const home = new URL(tablet ? 'prototype-lobby.html' : 'woki-os.html', location.href);
    home.search = location.search;
    home.hash = location.hash;
    location.replace(home.href);
  </script>
</head>
<body><a href="woki-os.html">Abrir Toki OS</a></body>
</html>
