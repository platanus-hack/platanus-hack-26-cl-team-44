<!doctype html>
<meta charset="utf-8">
<title>Autoprueba del kiosco</title>
<script type="module">
// Lo mismo que hace woki-os.html al activar la nariz o la mirada, pero con internet cortado por el kiosco.
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const r = {};
// Control: internet debe estar cortado; si no, la prueba no demuestra nada
try { await fetch('https://example.com/', { mode: 'no-cors', cache: 'no-store' }); r.red = 'abierta'; } catch { r.red = 'bloqueada'; }
try {
  const t0 = performance.now();
  const { FaceLandmarker, FilesetResolver } = await import(MP + '/vision_bundle.mjs');
  const files = await FilesetResolver.forVisionTasks(MP + '/wasm');
  const fl = await FaceLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: MODEL, delegate: 'CPU' }, runningMode: 'IMAGE', numFaces: 1 });
  const c = document.createElement('canvas'); c.width = c.height = 256; c.getContext('2d').fillRect(0, 0, 256, 256);
  const res = fl.detect(c);
  r.mediapipe = { ok: true, caras: res.faceLandmarks.length, ms: Math.round(performance.now() - t0) };
} catch (e) { r.mediapipe = { ok: false, error: String(e?.message || e).slice(0, 300) }; }
// Lo que WebEyeTrack pide por dentro (MediaPipe 0.10.3) también debe salir de la copia local
r.archivos = [];
for (const u of ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm/vision_wasm_internal.wasm',
                 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm/vision_wasm_internal.js']) {
  try { const b = await (await fetch(u)).arrayBuffer(); r.archivos.push({ url: u.split('/npm/')[1], ok: b.byteLength > 1000, bytes: b.byteLength }); }
  catch (e) { r.archivos.push({ url: u.split('/npm/')[1], ok: false, error: String(e?.message || e) }); }
}
console.log('PRUEBA ' + JSON.stringify(r));
</script>
