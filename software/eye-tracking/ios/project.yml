name: SoyGaze
options:
  # Valores personales fuera del repo: se pasan al generar (ver README › Instalar la app).
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SoyGaze:
    type: application
    platform: iOS
    sources:
      - path: SoyGaze
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.soygaze
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: SoyGaze/Info.plist
      properties:
        CFBundleDisplayName: Soy Gaze
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arkit]
        NSCameraUsageDescription: "Soy Gaze usa la cámara TrueDepth para seguir tu mirada. Las imágenes nunca salen del iPhone: solo se envían números de geometría al Mac."
        NSLocalNetworkUsageDescription: "Soy Gaze envía tu mirada al Mac de tu misma red para controlar la pantalla."
        NSBonjourServices: [_soygaze._tcp]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
